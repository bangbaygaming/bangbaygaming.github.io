<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Game Terserah</title>

        <!-- Bootstrap 5.3 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Custom Gaming Theme -->
        <style>
            :root {
            --bs-primary: #6f42c1;   /* neon purple */
            --bs-secondary: #1f1f2e; /* dark */
            --bs-success: #00ff9c;   /* neon green */
            --bs-info: #00d4ff;      /* cyan */
            --bs-warning: #ffc107;   /* gold */
            --bs-danger: #ff3860;    /* neon red */
            --bs-dark: #0d0d0d;
            --bs-light: #f8f9fa;
            }

            body {
            background-color: var(--bs-dark);
            color: white;
            scroll-behavior: smooth;
            }

            .navbar {
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            }

            .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            }

            .btn-gaming {
            background: linear-gradient(45deg, #6f42c1, #00d4ff);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            }

            .btn-gaming:hover {
            opacity: 0.85;
            }

            .card {
            background-color: #1a1a2e;
            border: none;
            border-radius: 15px;
            }

            .section {
            padding: 80px 0;
            }

            iframe {
            border-radius: 15px;
            }
        </style>
    </head>
    <body>

        <!-- NAVBAR -->
        <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="https://cdn.discordapp.com/attachments/1412360320625803314/1412360321183780956/award-globalgamemanagers.assets-41.png"
                        width="40" class="me-2">
                    <strong>Game Terserah</strong>
                </a>

                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="nav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                        <a class="nav-link" href="#download">Download</a>
                        </li>
                        <li class="nav-item">
                        <a class="nav-link" href="#tutorial">Tutorial</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- HERO -->
        <section class="hero section">
            <div class="container">
                <div class="row align-items-center">
                
                <!-- LEFT -->
                <div class="col-md-6 text-center text-md-start">
                    <h1 class="display-4 fw-bold">Game Terserah</h1>
                    <p class="lead">Game seru dengan pengalaman terbaik di PC & Android</p>
                    <a href="#download" class="btn btn-gaming mt-3">Download Sekarang</a>
                </div>

                <!-- RIGHT -->
                <div class="col-md-6 text-center mt-5 mt-md-0">
                    <img src="https://cdn.discordapp.com/attachments/1412360320625803314/1412360321183780956/award-globalgamemanagers.assets-41.png"
                        class="img-fluid" width="250">
                </div>

                </div>
            </div>
        </section>

        <!-- DOWNLOAD -->
        <section id="download" class="section">
            <div class="container text-center">
                <h2 class="mb-5">Download Game</h2>

                <div class="row g-4">

                <!-- PC -->
                <div class="col-md-6">
                    <div class="card p-4">
                    <h4>Versi PC</h4>
                    <p>Download untuk Windows</p>
                    <a href="#" class="btn btn-success">Download PC</a>
                    </div>
                </div>

                <!-- Android -->
                <div class="col-md-6">
                    <div class="card p-4">
                    <h4>Versi Android</h4>
                    <p>Download APK Android</p>
                    <a href="#" class="btn btn-info">Download Android</a>
                    </div>
                </div>

                </div>
            </div>
        </section>

        <!-- TUTORIAL -->
        <section id="tutorial" class="section bg-black">
            <div class="container text-center">
                <h2 class="mb-5">Tutorial</h2>

                <div class="ratio ratio-16x9">
                <iframe src="https://www.youtube.com/embed/nwTW6qkLDuI"
                        title="Tutorial Video"
                        allowfullscreen></iframe>
                </div>

            </div>
        </section>

        <!-- FOOTER -->
        <footer class="text-center py-4">
            <small>© 2026 Game Terserah. All rights reserved.</small>
        </footer>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
